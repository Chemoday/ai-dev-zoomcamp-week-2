# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Two services from this one monorepo:
#   - restaurant-backend: FastAPI, built from backend/Dockerfile
#   - restaurant-frontend: static Vite build, served by Render directly
#
# NOTE (free tier): Render's free web services have no persistent disk,
# so the backend's SQLite file resets on every redeploy and on the
# automatic spin-down after 15 minutes of inactivity. Fine for a demo;
# not durable storage. See docs/ai-usage-report.md / README.md.

services:
  - name: restaurant-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/tables

  - name: restaurant-frontend
    type: web
    runtime: static
    # Static sites have no `plan` field - they're always free on Render.
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # NOTE: fromService's `host` property resolves to Render's
      # *internal* private-networking hostname (e.g. "restaurant-backend-9ce6",
      # no domain) - only reachable from other Render services, not from
      # a browser. This static site's JS runs in the visitor's browser,
      # not inside Render's network, so it needs the real public
      # hostname instead. Hardcoded because of that; if this Blueprint
      # is ever recreated (new random suffix), update this to match
      # the backend service's actual onrender.com hostname.
      - key: VITE_API_BASE
        value: restaurant-backend-9ce6.onrender.com
