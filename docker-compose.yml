services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/restaurant.db
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
